# inventory.ini
#
# The 'proxmox' host must be reachable over SSH (for pveam/conf-file tasks)
# AND its PVE API reachable (for the proxmox modules; configured in
# group_vars/all.yml). Usually the same box.
#
# If your Ansible control node IS the Proxmox host, use the localhost line
# instead of the ssh line.

[proxmox]
# --- remote Proxmox host over SSH ---
pve ansible_host=192.168.1.10 ansible_user=root

# --- OR, if the control node is the Proxmox host itself, comment the line
#     above and uncomment this: ---
# pve ansible_connection=local
